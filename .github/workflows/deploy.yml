name: Deploy

on:
  push:
    branches: [ develop ]

env:
  IMAGE_BASE: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_bakerysite6_be

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Dockerfile
          - service: payment-service
            context: .
            dockerfile: payment-service/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: member-service
            context: .
            dockerfile: member-service/Dockerfile
          - service: ai-service
            context: .
            dockerfile: ai-service/Dockerfile
          - service: elasticsearch
            context: ./elasticsearch
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 2026-08-23 Compose → k3s 전환. 이전 deploy job은 EC2에서
  # `docker compose up -d --remove-orphans`를 실행했다 — 지금 그게 돌면 구 Compose
  # 스택이 되살아나 옛 DB에 write하고 80/443을 Traefik에서 뺏는다. 아래로 대체했다.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -Eeuo pipefail
            export KUBECONFIG=$HOME/.kube/config
            BASE=ghcr.io/prgrms-be-adv-devcourse/beadv7_7_bakerysite6_be
            SHA=${{ github.sha }}

            cd ${{ secrets.EC2_PROJECT_DIR }}
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Node A 8GB에서 Compose와 공존하다 available 81Mi로 apiserver가 교착된
            # 적이 있다(2026-08-23). 롤링 중에는 Pod가 일시적으로 두 배가 되므로
            # 여유가 없으면 시작하지 않는다.
            AVAIL=$(free -m | awk '/^Mem:/ {print $7}')
            echo "available: ${AVAIL}Mi"
            if [ "$AVAIL" -lt 2048 ]; then
              echo "가용 메모리가 2Gi 미만이다. 배포를 중단한다." >&2
              exit 1
            fi

            # 데이터 계층 — Elasticsearch만 자체 빌드 이미지라 SHA 주입이 필요하다.
            # 이 단계를 빼두면 사람이 `apply -k data`를 돌릴 때마다 ES가 저장소
            # 기본값 sha-placeholder로 되돌아가 ImagePullBackOff가 난다.
            # 2026-08-24에 실제로 93분 장애가 났고, ES가 headless Service라
            # endpoint가 사라지면서 backend까지 DNS 해석 실패로 연쇄 실패했다.
            # postgres/redis/kafka는 고정 태그라 apply 해도 재시작되지 않는다.
            cd k8s/openbake/data
            kustomize edit set image "$BASE-elasticsearch=$BASE-elasticsearch:$SHA"
            if kubectl kustomize . | grep -q "sha-placeholder"; then
              echo "data에 sha-placeholder가 남아 있다. 배포를 중단한다." >&2
              git checkout kustomization.yaml
              exit 1
            fi
            kubectl apply -k .
            git checkout kustomization.yaml
            cd -
            kubectl -n openbake rollout status statefulset/elasticsearch --timeout=300s

            cd k8s/openbake/apps
            kustomize edit set image \
              "$BASE-backend=$BASE-backend:$SHA" \
              "$BASE-member-service=$BASE-member-service:$SHA" \
              "$BASE-payment-service=$BASE-payment-service:$SHA" \
              "$BASE-api-gateway=$BASE-api-gateway:$SHA" \
              "$BASE-ai-service=$BASE-ai-service:$SHA"

            # placeholder가 남아 있으면 존재하지 않는 이미지를 배포하게 된다.
            if kubectl kustomize . | grep -q "sha-placeholder"; then
              echo "sha-placeholder가 남아 있다. 배포를 중단한다." >&2
              git checkout kustomization.yaml
              exit 1
            fi

            kubectl apply -k .
            git checkout kustomization.yaml

            # apply 한 번으로 5개 Deployment가 동시에 롤링된다. 아래 status는
            # 순차로 기다릴 뿐이라 전체 소요는 합이 아니라 가장 느린 하나다.
            cd -
            for d in member-service payment-service backend api-gateway ai-service; do
              kubectl -n openbake rollout status "deployment/$d" --timeout=300s
            done

            kubectl -n openbake get pod -o wide
            free -h
