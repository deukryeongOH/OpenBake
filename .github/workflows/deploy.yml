name: Deploy

on:
  push:
    branches: [ develop ]

env:
  IMAGE_BASE: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_bakerysite6_be

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Dockerfile
          - service: payment-service
            context: .
            dockerfile: payment-service/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: member-service
            context: .
            dockerfile: member-service/Dockerfile
          - service: ai-service
            context: .
            dockerfile: ai-service/Dockerfile
          - service: elasticsearch
            context: ./elasticsearch
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # 2026-08-23 Compose → k3s 전환. 이전 deploy job은 EC2에서
  # `docker compose up -d --remove-orphans`를 실행했다 — 지금 그게 돌면 구 Compose
  # 스택이 되살아나 옛 DB에 write하고 80/443을 Traefik에서 뺏는다. 아래로 대체했다.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 순차 롤아웃이라 5개 기동 시간의 합이 든다(약 8~10분). 데이터 계층까지 포함해 여유를 둔다.
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            export KUBECONFIG=$HOME/.kube/config
            BASE=ghcr.io/prgrms-be-adv-devcourse/beadv7_7_bakerysite6_be
            SHA=${{ github.sha }}

            cd ${{ secrets.EC2_PROJECT_DIR }}
            git fetch origin
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # Node A 8GB에서 Compose와 공존하다 available 81Mi로 apiserver가 교착된
            # 적이 있다(2026-08-23). 롤링 중에는 Pod가 일시적으로 두 배가 되므로
            # 여유가 없으면 시작하지 않는다.
            AVAIL=$(free -m | awk '/^Mem:/ {print $7}')
            echo "available: ${AVAIL}Mi"
            if [ "$AVAIL" -lt 2048 ]; then
              echo "가용 메모리가 2Gi 미만이다. 배포를 중단한다." >&2
              exit 1
            fi

            # 데이터 계층 — Elasticsearch만 자체 빌드 이미지라 SHA 주입이 필요하다.
            # 이 단계를 빼두면 사람이 `apply -k data`를 돌릴 때마다 ES가 저장소
            # 기본값 sha-placeholder로 되돌아가 ImagePullBackOff가 난다.
            # 2026-08-24에 실제로 93분 장애가 났고, ES가 headless Service라
            # endpoint가 사라지면서 backend까지 DNS 해석 실패로 연쇄 실패했다.
            # postgres/redis/kafka는 고정 태그라 apply 해도 재시작되지 않는다.
            cd k8s/openbake/data
            kustomize edit set image "$BASE-elasticsearch=$BASE-elasticsearch:$SHA"
            if kubectl kustomize . | grep -q "sha-placeholder"; then
              echo "data에 sha-placeholder가 남아 있다. 배포를 중단한다." >&2
              git checkout kustomization.yaml
              exit 1
            fi
            kubectl apply -k .
            git checkout kustomization.yaml
            cd -
            kubectl -n openbake rollout status statefulset/elasticsearch --timeout=300s

            cd k8s/openbake/apps
            kustomize edit set image \
              "$BASE-backend=$BASE-backend:$SHA" \
              "$BASE-member-service=$BASE-member-service:$SHA" \
              "$BASE-payment-service=$BASE-payment-service:$SHA" \
              "$BASE-api-gateway=$BASE-api-gateway:$SHA" \
              "$BASE-ai-service=$BASE-ai-service:$SHA"

            # placeholder가 남아 있으면 존재하지 않는 이미지를 배포하게 된다.
            if kubectl kustomize . | grep -q "sha-placeholder"; then
              echo "sha-placeholder가 남아 있다. 배포를 중단한다." >&2
              git checkout kustomization.yaml
              exit 1
            fi

            # 2코어 노드에서 JVM 5개가 동시에 기동하면 서로 CPU를 뺏어 startupProbe를
            # 넘기지 못한다. 2026-08-26에 새 Pod 4개가 한 노드에 몰려 전부 7~8회씩
            # 재시작하며 10분 가까이 서로를 죽였다(옛 Pod가 살아 있어 서비스는 유지).
            #
            # apply 한 번으로 5개가 동시에 롤링되는 것이 원인이므로, 먼저 전부 멈춰둔
            # 뒤 apply 하고 하나씩 재개해 기동을 직렬화한다. 배포 시간은 가장 느린
            # 하나가 아니라 합이 되지만(약 8~10분), 동시 기동 실패보다 낫다.
            APPS="member-service payment-service backend api-gateway ai-service"
            for d in $APPS; do
              kubectl -n openbake rollout pause "deployment/$d" || true
            done

            # 중간에 실패해 스크립트가 끊겨도 일시정지 상태가 남으면 이후 배포가
            # 반영되지 않는다. 어떤 경로로 끝나든 반드시 재개한다.
            trap 'for d in '"$APPS"'; do kubectl -n openbake rollout resume "deployment/$d" 2>/dev/null || true; done' EXIT

            kubectl apply -k .
            git checkout kustomization.yaml
            cd -

            # 하나씩 재개하고 Ready 를 확인한 뒤 다음으로 넘어간다.
            # startupProbe 유예가 240초이므로 timeout 은 그보다 넉넉해야 한다.
            for d in $APPS; do
              echo "--- rollout: $d"
              kubectl -n openbake rollout resume "deployment/$d" 2>/dev/null || true
              kubectl -n openbake rollout status "deployment/$d" --timeout=420s
            done
            trap - EXIT

            kubectl -n openbake get pod -o wide
            free -h
