# prod profile 전용 override. 현재 ai-service는 로깅 하향 대상이 없다.

# 구조화 로그(JSON)를 prod에서만 켠다.
#
# 왜 prod에서만인가: 로컬 개발에서는 사람이 읽는 형식이 훨씬 빠르다. JSON 한 줄은
# 눈으로 훑기 어렵다. 중앙 수집이 필요한 곳은 운영뿐이다.
#
# 왜 필요한가: 지금 로그는 Pod 안에만 있어 **Pod가 죽으면 함께 사라진다.** 장애를
# 조사할 시점에는 이미 재시작된 뒤인 경우가 많다. Loki로 모으려면 먼저 기계가 읽을
# 수 있는 형식이어야 하고, 그것이 이 설정이다.
#
# ecs(Elastic Common Schema)를 택한 이유: 필드 이름이 표준화되어 있어 Loki 질의와
# Grafana 패널을 서비스마다 따로 만들 필요가 없다. logstash/gelf도 지원하지만
# 우리는 Elasticsearch를 이미 쓰고 있어 팀에게 낯익은 쪽이 낫다.
#
# MDC는 자동으로 포함된다. RequestIdMdcFilter가 넣는 requestId가 JSON 필드로
# 나오므로, 한 요청이 서비스를 가로지른 로그를 Loki에서 그 값으로 묶을 수 있다.
# **이것이 어제 깔아둔 MDC 배관에 물이 흐르기 시작하는 지점이다.**
#
# 마스킹은 SensitiveFieldMaskingCustomizer가 담당한다. 로그가 중앙에 모이면
# 오래 보관되고 검색 가능해지므로, 한 번 새어 나간 값이 계속 남는다.
# 모으기 전에 그물을 먼저 친다.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: openbake-ai
        environment: prod
    json:
      customizer: com.openbake.common.logging.SensitiveFieldMaskingCustomizer

# 운영 샘플링. 1.0(전량)이다.
#
# 처음에는 0.1로 잡았다가 **실측 후 1.0으로 올렸다**(2026-08-27).
#
# 0.1일 때 실제로 문제가 있었다. 로그에는 모든 요청의 traceId가 찍히는데 span은
# 10%만 저장되므로, **로그에서 찾은 traceId를 추적 화면에 넣으면 10번 중 9번은
# "없음"이 나온다.** 장애 조사 흐름(로그 -> 추적)이 사실상 끊긴다.
#
# 실측 근거:
#   평상시 트래픽   0.61 req/s   -> 전량 추적해도 초당 span 몇 개다
#   Tempo 저장량    12.7MB       -> 10배로 늘어도 PVC 2GB의 6%
#   앱 CPU          12~17m       -> 여유가 크다
#
# ⚠️ 드롭·부하 테스트 전에는 낮춰야 한다. 부하 테스트 최고치가 26 req/s였고
# 드롭은 300 동시다. 그때는 span 생성·전송이 CPU를 먹는데 하필 가장 여유 없는
# 시점이다. 전송 큐(2048)가 넘치면 span이 조용히 버려지기도 한다.
#
#   kubectl -n openbake set env deploy/backend TRACING_SAMPLING=0.05
#
# 코드 변경 없이 환경변수로 조절할 수 있게 해 둔 이유가 이것이다.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  # span을 Tempo로 보낸다.
  #
  # ⚠️ 전송 방식과 포트가 짝이 맞아야 한다. 이걸 틀리면 **조용히 실패한다.**
  #   OTLP HTTP  -> 4318, 경로 /v1/traces 까지 필요
  #   OTLP gRPC  -> 4317, 경로 없음
  #
  # 2026-08-27 실측: transport 기본값이 http인데 endpoint를 4317(gRPC 포트)로 줬다가
  # span이 한 건도 도착하지 않았다. OTLP exporter는 전송에 실패해도 애플리케이션을
  # 멈추지 않고 재시도하다 버리므로 **앱 로그에 아무 흔적이 없었다.**
  # Tempo의 tempo_distributor_spans_received_total이 생성되지 않는 것으로 알았다.
  #
  # 여기서는 HTTP를 쓴다. 기본 전송 방식이고, 4318이 실제로 응답하는 것을
  # 확인했다(빈 본문에 415 unsupported media type = 요청이 파싱까지 갔다는 뜻).
  #
  # 기본 프로필에는 넣지 않는다. 로컬에 Tempo가 없는 것이 정상이고, 없는 주소로
  # 계속 재시도하면 로그가 지저분해진다.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo.monitoring.svc.cluster.local:4318/v1/traces}
          transport: http
