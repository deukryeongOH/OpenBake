server:
  port: 8083   # AI 추천 서비스 전용 포트
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  application:
    name: ai-service
  datasource:
    url: ${AI_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ai-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

openbake:
  ai:
    interaction:
      view-suppression: PT5M
      interaction-retention: P90D
      consumed-event-retention: P90D
      deletion-marker-retention: P35D
      cleanup-batch-size: 1000
      cleanup-cron: "0 20 4 * * *"
      recommendation-cache-key-prefix: "ai:recommendation:v1:"
    recommendation:
      cache-ttl: PT15M
      default-size: 10
      max-size: 20
      candidate-multiplier: 5
      candidate-max: 100
      profile-window: P90D
      popular-purchase-window: P30D
      popular-cart-window: P7D
      core-timeout: PT3S
      # raw cosine 단위. Elasticsearch _score 0.65와 같다. 0이면 하한선을 비활성화한다.
      min-cosine: 0.30
      cold-start-threshold: 3
      cold-start-category-weight: 0.60
      established-category-weight: 0.30
      weights:
        view: 1
        cart-add: 3
        purchase: 5
      half-life:
        view: P5D
        cart-add: P14D
        purchase: P45D
    semantic-search:
      default-size: 50
      max-size: 100
      max-query-length: 200
      # raw cosine 단위. Elasticsearch _score 0.65와 같다. 0이면 하한선을 비활성화한다.
      min-cosine: 0.30
    embedding:
      model: text-embedding-3-small
      dimensions: 1536
      index-name: product-embeddings-v1
      search-index-name: ${AI_SEARCH_INDEX_NAME:${openbake.ai.embedding.index-name}}
      index-version: v1
      connect-timeout: PT3S
      read-timeout: PT30S
      worker:
        interval: PT2S
        batch-size: 20
        lease: PT5M
    backfill:
      page-size: 100
      page-delay: PT1S
    reconcile:
      max-deletions: 100
    metrics:
      refresh-interval: PT30S
    dlt:
      max-fetch: 100
      allowed-topics:
        - product.changed.v1.dlt
        - product.viewed.v1.dlt
        - cart.item-added.v1.dlt
        - order.purchase-confirmed.v1.dlt
        - member.withdrawn.v1.dlt


# 분산 추적. micrometer-tracing-bridge-otel이 traceId/spanId를 만들고 서비스 간에
# 전파한다.
#
# 왜 필요한가: X-Request-Id를 MDC에 넣는 RequestIdMdcFilter는 서블릿 필터이고 MDC는
# ThreadLocal이라 **api-gateway(WebFlux)의 리액터 스레드 전환을 넘지 못한다.**
# 게이트웨이 로그에 상관관계 ID를 남길 방법이 그것 말고 없었다. Micrometer Tracing은
# Reactor Context 전파를 지원하므로 그 빈틈을 메운다.
#
# 그리고 requestId와 달리 traceId는 **구간(span)을 나눈다.** 어느 서비스에서 몇 ms가
# 걸렸는지 알 수 있다. requestId는 "같은 요청의 로그를 묶는" 것까지가 전부였다.
#
# ⚠️ 여기서는 exporter endpoint를 설정하지 않는다. 그러면 span이 **어디로도 전송되지
# 않고** traceId 전파와 로그 기록만 동작한다. 추적 백엔드(Tempo)가 준비되면
# management.otlp.tracing.endpoint를 켠다. 백엔드 없이 endpoint를 켜면 전송 실패
# 로그가 계속 쌓인다.
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  # 요청 하나가 서비스를 가로지른 경로를 로그로 따라가려면 X-Request-Id가 로그에
  # 있어야 한다. 게이트웨이의 RequestIdFilter는 헤더 전달만 하고, 각 서비스가
  # common의 RequestIdMdcFilter로 MDC에 넣어야 %X{requestId}가 채워진다.
  # 값이 없는 로그(기동·배치)는 대괄호 안이 비어 보인다.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
