spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      connection-init-sql:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  kafka:
    listener:
      auto-startup: false

OPENAI_API_KEY: test-key

openbake:
  ai:
    interaction:
      view-suppression: PT5M
      interaction-retention: P90D
      consumed-event-retention: P90D
      deletion-marker-retention: P35D
      cleanup-batch-size: 1000
      cleanup-cron: "-"
      recommendation-cache-key-prefix: "ai:recommendation:v1:"
    recommendation:
      cache-ttl: PT15M
      default-size: 10
      max-size: 20
      candidate-multiplier: 5
      candidate-max: 100
      profile-window: P90D
      popular-purchase-window: P30D
      popular-cart-window: P7D
      core-timeout: PT3S
      weights:
        view: 1
        cart-add: 3
        purchase: 5
      half-life:
        view: P5D
        cart-add: P14D
        purchase: P45D
    embedding:
      model: text-embedding-3-small
      dimensions: 1536
      index-name: product-embeddings-v1
      index-version: v1
      connect-timeout: PT3S
      read-timeout: PT30S
      worker:
        interval: PT2S
        batch-size: 20
        lease: PT5M

CORE_SERVICE_URL: http://localhost:18080
AI_SERVICE_TOKEN: ${random.uuid}
