# prod profile 전용 override. 현재 gateway는 로깅 하향 대상이 없다.

# 구조화 로그(JSON)를 prod에서만 켠다.
#
# 왜 prod에서만인가: 로컬 개발에서는 사람이 읽는 형식이 훨씬 빠르다. JSON 한 줄은
# 눈으로 훑기 어렵다. 중앙 수집이 필요한 곳은 운영뿐이다.
#
# 왜 필요한가: 지금 로그는 Pod 안에만 있어 **Pod가 죽으면 함께 사라진다.** 장애를
# 조사할 시점에는 이미 재시작된 뒤인 경우가 많다. Loki로 모으려면 먼저 기계가 읽을
# 수 있는 형식이어야 하고, 그것이 이 설정이다.
#
# ecs(Elastic Common Schema)를 택한 이유: 필드 이름이 표준화되어 있어 Loki 질의와
# Grafana 패널을 서비스마다 따로 만들 필요가 없다. logstash/gelf도 지원하지만
# 우리는 Elasticsearch를 이미 쓰고 있어 팀에게 낯익은 쪽이 낫다.
#
# MDC는 자동으로 포함된다. RequestIdMdcFilter가 넣는 requestId가 JSON 필드로
# 나오므로, 한 요청이 서비스를 가로지른 로그를 Loki에서 그 값으로 묶을 수 있다.
# **이것이 어제 깔아둔 MDC 배관에 물이 흐르기 시작하는 지점이다.**
#
# 마스킹은 SensitiveFieldMaskingCustomizer가 담당한다. 로그가 중앙에 모이면
# 오래 보관되고 검색 가능해지므로, 한 번 새어 나간 값이 계속 남는다.
# 모으기 전에 그물을 먼저 친다.
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: openbake-gateway
        environment: prod
    json:
      customizer: com.openbake.common.logging.SensitiveFieldMaskingCustomizer

# 운영 샘플링. 기본 프로필은 1.0(전량)이지만 운영에서는 낮춘다.
#
# 드롭 오픈에는 300명이 동시에 들어온다. 전량 추적하면 span 생성·전송이 그 순간
# CPU를 더 먹는데, 하필 그때가 가장 여유 없는 시점이다. Node A는 이미 CPU 예약이
# 빠듯하다.
#
# 0.1은 가설이다. span을 실제로 저장하기 시작하면(Tempo) 저장량과 CPU를 보고
# 조정한다. 지금은 exporter endpoint가 없어 전송이 없으므로 이 값이 비용에
# 영향을 주는 부분은 span 객체 생성뿐이다.
#
# ⚠️ 샘플링을 낮추면 **로그의 traceId는 그대로 찍히지만** 그 trace의 span이
# 백엔드에 남지 않는다. 즉 "로그는 있는데 추적 화면에는 없는" 경우가 생긴다.
# 장애 조사 때 이 점을 알고 있어야 헤매지 않는다.
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  # span을 Tempo로 보낸다.
  #
  # ⚠️ 이 설정이 없으면 traceId는 로그에 찍히지만 **span은 어디에도 저장되지 않는다.**
  # 그러면 "어느 구간이 몇 ms 걸렸는가"를 볼 수 없다. 로그 상관관계까지가 전부다.
  #
  # OTLP exporter는 전송에 실패해도 애플리케이션을 멈추지 않는다. 재시도하다 버린다.
  # 즉 주소가 틀리거나 NetworkPolicy에 막히면 **조용히 사라진다.** 배포 후
  # tempo_distributor_spans_received_total이 증가하는지 반드시 확인한다.
  #
  # 기본 프로필에는 넣지 않는다. 로컬 개발에서 Tempo가 없는 것이 정상이고,
  # 없는 주소로 계속 재시도하면 로그가 지저분해진다.
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://tempo.monitoring.svc.cluster.local:4317}
