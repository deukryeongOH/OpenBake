server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}

openbake:
  security:
    gateway-jwt-enabled: ${GATEWAY_JWT_ENABLED:false}
    blacklist-timeout: ${BLACKLIST_TIMEOUT:300ms}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "https://bakery-site6-fe.vercel.app"
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
          routes:
            - id: member-auth
              uri: ${MEMBER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              order: -100
            - id: member-api
              uri: ${MEMBER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/members/**
              order: -90
            - id: payment-webhook
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/webhooks/pg/**
              order: -80
            - id: payment-api
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/deposit/**
              order: -70
            - id: ai-recommendation
              uri: ${AI_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/recommendations/**
              order: -30
            - id: core-swagger-ui
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/swagger-ui.html,/swagger-ui/**
              order: -20
            - id: core-api-docs
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/v3/api-docs,/v3/api-docs/**
              order: -10
            - id: core-api
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              order: 0
          httpclient:
            # 부하 테스트 시에만 늘린다. 운영 기본값은 그대로 유지할 것.
            # 이 값이 인증된 요청의 실질적인 응답시간 상한이라,
            # k6 타임아웃만 늘리면 여기서 504로 잘린다.
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
