server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

jwt:
  secret: ${JWT_SECRET}

openbake:
  security:
    gateway-jwt-enabled: ${GATEWAY_JWT_ENABLED:false}
    blacklist-timeout: ${BLACKLIST_TIMEOUT:300ms}

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 25s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "https://bakery-site6-fe.vercel.app"
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
          # root/member/payment도 각자 CORS 헤더를 추가하도록 설정돼 있어(HeaderAuthenticationFilter와
          # 무관하게 각 서비스 SecurityConfig의 CorsConfigurationSource), 게이트웨이가 응답을 프록시하며
          # globalcors가 한 번 더 얹으면 Access-Control-Allow-Origin/-Credentials가 중복돼 브라우저가
          # preflight/실응답을 CORS 실패로 처리한다. 모든 라우트에 공통 적용되도록 default-filters로
          # 첫 번째 값만 남긴다(각 서비스 CORS 설정 자체는 그대로 둠).
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_FIRST
          routes:
            - id: member-auth
              uri: ${MEMBER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
              order: -100
            - id: member-api
              uri: ${MEMBER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/members/**
              order: -90
            - id: payment-webhook
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/webhooks/pg/**
              order: -80
            - id: payment-api
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/deposit/**
              order: -70
            - id: ai-recommendation
              uri: ${AI_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/recommendations/**
              order: -30
            - id: core-swagger-ui
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/swagger-ui.html,/swagger-ui/**
              order: -20
            - id: core-api-docs
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/v3/api-docs,/v3/api-docs/**
              order: -10
            - id: core-api
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              order: 0
            # /internal/v1/** (관리자 전용 정산 API)는 지금까지 게이트웨이에 라우트가 아예 없어서
            # 인증된 관리자 요청도 게이트웨이 404로 막혔다(권한 검사 자체는 root의 SecurityConfig
            # hasRole("ADMIN")이 그대로 담당 — 여기선 프록시만 추가한다). 2026-08-26 브라우저 E2E로
            # 발견: FE는 게이트웨이 단일 진입점만 쓰므로 라우트가 없으면 관리자 화면 자체가
            # 원천적으로 동작할 수 없었다.
            - id: core-internal-api
              uri: ${CORE_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/internal/**
              order: 10
          httpclient:
            # 부하 테스트 시에만 늘린다. 운영 기본값은 그대로 유지할 것.
            # 이 값이 인증된 요청의 실질적인 응답시간 상한이라,
            # k6 타임아웃만 늘리면 여기서 504로 잘린다.
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
