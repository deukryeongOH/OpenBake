services:
  postgres:
    image: postgres:17
    container_name: openbake-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openbake
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbake"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  redis:
    image: redis:7
    container_name: openbake-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbake-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/openbake
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_SERVICE_URL: http://payment-service:8082
      MEMBER_SERVICE_URL: http://member-service:8081
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      SETTLEMENT_ENCRYPTION_KEY: ${SETTLEMENT_ENCRYPTION_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openbake-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: openbake-payment
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://payment-postgres:5432/openbake_payment
      DB_USERNAME: openbake
      DB_PASSWORD: openbake
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    depends_on:
      payment-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openbake-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: openbake-api-gateway
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MEMBER_SERVICE_URL: http://member-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      CORE_SERVICE_URL: http://backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_JWT_ENABLED: "true"
      BLACKLIST_TIMEOUT: 300ms
    depends_on:
      backend:
        condition: service_healthy
      member-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - openbake-net

  nginx:
    image: nginx:1.27-alpine
    container_name: openbake-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - openbake-net

  certbot:
    image: certbot/certbot
    container_name: openbake-certbot
    restart: unless-stopped
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    networks:
      - openbake-net

  payment-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openbake_payment
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-payment-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openbake" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ openbake-net ]

  member-postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: openbake_member
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-member-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openbake" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ openbake-net ]

  member-service:
    build:
      context: .
      dockerfile: member-service/Dockerfile
    container_name: openbake-member-service
    env_file: [ .env ]      # JWT_SECRET, GOOGLE_CLIENT_ID 등 기존 값 재사용
    environment:
      DB_URL: jdbc:postgresql://member-postgres:5432/openbake_member
      REDIS_HOST: redis    # 기존 Redis 컨테이너 재사용 (블랙리스트/토큰 저장, 키 네임스페이스로 구분됨)
      REDIS_PORT: 6379
    depends_on:
      member-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
    networks: [ openbake-net ]

networks:
  openbake-net:
    driver: bridge

volumes:
  openbake-pg-data:
  certbot-webroot:
  certbot-etc:
  openbake-payment-pg-data:
  openbake-member-pg-data:
