services:
  postgres:
    image: postgres:17
    container_name: openbake-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openbake
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbake"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  elasticsearch:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: openbake-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - openbake-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - openbake-net

  redis:
    image: redis:7
    container_name: openbake-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbake-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/openbake
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_SERVICE_URL: http://payment-service:8082
      MEMBER_SERVICE_URL: http://member-service:8081
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      SETTLEMENT_ENCRYPTION_KEY: ${SETTLEMENT_ENCRYPTION_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openbake-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: openbake-payment
    restart: unless-stopped
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-postgres:5432/openbake_payment
      DB_USERNAME: openbake
      DB_PASSWORD: openbake
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
    depends_on:
      payment-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openbake-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: openbake-api-gateway
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      MEMBER_SERVICE_URL: http://member-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      CORE_SERVICE_URL: http://backend:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GATEWAY_JWT_ENABLED: "true"
      BLACKLIST_TIMEOUT: ${BLACKLIST_TIMEOUT:-2000ms}
      # 부하 테스트에서 실제 응답시간을 측정할 때만 올린다. 기본값은 운영 기준 유지.
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-10s}
    depends_on:
      backend:
        condition: service_healthy
      member-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - openbake-net

  nginx:
    image: nginx:1.27-alpine
    container_name: openbake-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - openbake-net

  certbot:
    image: certbot/certbot
    container_name: openbake-certbot
    restart: unless-stopped
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    networks:
      - openbake-net

  payment-postgres:
    image: postgres:17
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: openbake_payment
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-payment-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openbake" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ openbake-net ]

  member-postgres:
    image: postgres:17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: openbake_member
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-member-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openbake" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ openbake-net ]

  member-service:
    build:
      context: .
      dockerfile: member-service/Dockerfile
    container_name: openbake-member-service
    env_file: [ .env ]      # JWT_SECRET, GOOGLE_CLIENT_ID 등 기존 값 재사용
    environment:
      MEMBER_DB_URL: jdbc:postgresql://member-postgres:5432/openbake_member
      REDIS_HOST: redis    # 기존 Redis 컨테이너 재사용 (블랙리스트/토큰 저장, 키 네임스페이스로 구분됨)
      REDIS_PORT: 6379
    depends_on:
      member-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
    networks: [ openbake-net ]

  ai-postgres:
    image: postgres:17
    container_name: openbake-ai-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: openbake_ai
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - openbake-ai-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ openbake-net ]

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: openbake-ai-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      AI_DB_URL: jdbc:postgresql://ai-postgres:5432/openbake_ai
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      ai-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [ openbake-net ]

  kafka:
    image: apache/kafka:3.9.0
    container_name: openbake-kafka
    ports:
      - "9092:9092"       # 호스트에서 접속 (로컬 스크립트/테스트용)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # 명시적 생성으로 결정했으니 auto-create는 끈다
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [ openbake-net ]

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: [ "/bin/sh", "-c" ]
    command: >
      "
      for t in product.changed.v1 product.viewed.v1 cart.item-added.v1 order.purchase-confirmed.v1 member.withdrawn.v1; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1;
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t.dlt --partitions 1 --replication-factor 1;
      done
      "
    networks: [ openbake-net ]

networks:
  openbake-net:
    driver: bridge

volumes:
  openbake-pg-data:
  certbot-webroot:
  certbot-etc:
  openbake-payment-pg-data:
  openbake-member-pg-data:
  openbake-ai-pg-data:
  openbake-es-data:
