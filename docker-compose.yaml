services:
  postgres:
    image: postgres:17
    container_name: openbake-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openbake
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbake"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: openbake-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - openbake-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - openbake-net

  redis:
    image: redis:7
    container_name: openbake-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbake-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/openbake
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYMENT_SERVICE_URL: http://payment-service:8082
      MEMBER_SERVICE_URL: http://member-service:8081
      ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openbake-net

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: openbake-payment
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-postgres:5432/openbake_payment
      DB_USERNAME: openbake
      DB_PASSWORD: openbake
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      payment-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openbake-net

  nginx:
    image: nginx:1.27-alpine
    container_name: openbake-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      member-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - openbake-net

  certbot:
    image: certbot/certbot
    container_name: openbake-certbot
    restart: unless-stopped
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    networks:
      - openbake-net

  payment-postgres:
    image: postgres:17
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: openbake_payment
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-payment-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openbake" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ openbake-net ]

  member-postgres:
    image: postgres:17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: openbake_member
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-member-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U openbake" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [ openbake-net ]

  member-service:
    build:
      context: .
      dockerfile: member-service/Dockerfile
    container_name: openbake-member-service
    ports:
      - "8081:8081"
    env_file: [ .env ]      # JWT_SECRET, GOOGLE_CLIENT_ID 등 기존 값 재사용
    environment:
      MEMBER_DB_URL: jdbc:postgresql://member-postgres:5432/openbake_member
      REDIS_HOST: redis    # 기존 Redis 컨테이너 재사용 (블랙리스트/토큰 저장, 키 네임스페이스로 구분됨)
      REDIS_PORT: 6379
    depends_on:
      member-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
    networks: [ openbake-net ]

networks:
  openbake-net:
    driver: bridge

volumes:
  openbake-pg-data:
  certbot-webroot:
  certbot-etc:
  openbake-payment-pg-data:
  openbake-member-pg-data:
  openbake-es-data:
