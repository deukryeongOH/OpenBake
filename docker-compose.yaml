services:
  postgres:
    image: postgres:17
    container_name: openbake-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: openbake
      POSTGRES_USER: openbake
      POSTGRES_PASSWORD: openbake
    volumes:
      - openbake-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openbake"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  redis:
    image: redis:7
    container_name: openbake-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openbake-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openbake-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/openbake
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - openbake-net

  nginx:
    image: nginx:1.27-alpine
    container_name: openbake-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - openbake-net

  certbot:
    image: certbot/certbot
    container_name: openbake-certbot
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-etc:/etc/letsencrypt:ro
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    networks:
      - openbake-net

networks:
  openbake-net:
    driver: bridge

volumes:
  openbake-pg-data:
  certbot-webroot:
  certbot-etc:
