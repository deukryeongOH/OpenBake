# Keep this file ASCII-only: .properties files are read as ISO-8859-1.

# Skip tasks whose inputs are unchanged.
# In CI, test tasks of untouched modules resolve FROM-CACHE.
org.gradle.caching=true

# Reuse the configuration phase result across invocations.
org.gradle.configuration-cache=true

# Build and test the modules in parallel.
org.gradle.parallel=true

# Default heap causes GC pressure across multi-module tests.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
