# k3s 기본 packaged Traefik(HelmChart, kube-system)에 대한 값 오버라이드.
# 05번 문서 5장: cert-manager 없이 Traefik 자체 ACME(HTTP-01)를 사용한다.
#
# 05번 문서는 이 CR을 Node A의 /var/lib/rancher/k3s/server/manifests에 파일로 두는 절차를
# 설명하지만, HelmChartConfig는 helm-controller(kube-system)가 지속적으로 감시하는 일반
# Custom Resource이므로 다른 cluster/ 리소스와 동일하게 `kubectl apply -k`로 적용해도
# 동작이 같다. 이 저장소의 GitOps 흐름(k8s/README.md 적용 순서)과 맞추기 위해 후자를 택함
# — 05번 문서 대비 적용 방식의 차이이며 결과는 동일하다.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      replicas: 1

    nodeSelector:
      openbake.io/node-pool: core

    # 자원을 지정하지 않으면 QoS가 BestEffort가 되어 node-a의 CPU 경쟁에서 가장 먼저
    # 밀린다. Traefik은 모든 외부 트래픽의 TLS 종단을 혼자 처리하므로 여기서 밀리면
    # 뒤쪽 서비스가 아무리 한가해도 처리량이 오르지 않는다.
    #
    # 2026-08-24 실측: 300 동시 요청에서 Traefik 경유 18 req/s vs 게이트웨이 직접
    # 34 req/s. backend는 Tomcat 스레드 6/200으로 놀고 있었다.
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 256Mi

    persistence:
      enabled: true
      name: traefik-acme
      path: /data
      size: 1Gi
      storageClass: local-path-retain
      accessMode: ReadWriteOnce

    additionalArguments:
      # ACME 등록 email: 사용자 확정값
      - "--certificatesresolvers.letsencrypt.acme.email=hhh3915@gmail.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      # 인증서 키를 ECDSA P-256으로. Traefik ACME 기본값은 RSA4096이다.
      #
      # 2026-08-26 실측(node-a, openssl speed): TLS 1.3에서 핸드셰이크마다 서버가
      # 개인키 서명을 한 번 한다. 그 연산이
      #     RSA 4096      초당    186회   <- 기본값
      #     RSA 2048      초당  1,141회
      #     ECDSA P-256   초당 28,201회
      # 이다. 드롭 오픈은 300명이 동시에 새 연결을 맺으므로 RSA4096이면 그 서명에만
      # 1.61 CPU-초가 필요하고, Traefik의 limit은 1코어다. 실제로 신규 연결 측정에서
      # 요청이 게이트웨이에 닿기까지 2.18초가 걸렸다(연결을 미리 세우면 0.30초).
      #
      # 클라이언트 검증은 RSA 10,843회/s 대 ECDSA 8,778회/s로 차이가 미미하다.
      # 보안 강도는 P-256이 RSA 3072 상당이라 4096보다 낮지만 현실적 공격 임계보다
      # 한참 위이고, 주요 CDN의 기본 선택이다.
      #
      # keytype만 바꾸면 acme.json에 저장된 기존 인증서를 만료 30일 전까지 계속 쓴다.
      # 전환하려면 저장된 인증서를 지워 재발급을 유도해야 하며, 그 사이 10~60초 동안
      # 자체 서명 인증서로 응답한다.
      - "--certificatesresolvers.letsencrypt.acme.keytype=EC256"
      # HTTP → HTTPS 리다이렉트. chart의 `ports.web.redirections` 키는 이 버전에서
      # args를 만들지 않아(2026-08-23 실측) 직접 넣는다. ACME HTTP-01 챌린지 라우터가
      # 이 리다이렉트보다 우선하므로 인증서 갱신에는 영향이 없다.
      #
      # `to=websecure`(엔트리포인트 이름)로 주면 Location에 컨테이너 내부 포트 8443이
      # 그대로 나가 외부에서 접속이 안 된다(2026-08-23 실측). 외부 포트를 직접 지정한다.
      - "--entryPoints.web.http.redirections.entryPoint.to=:443"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
      # 최초 발급 검증 시에만 아래 staging 서버 라인을 추가해 rate limit 없이 흐름을 확인하고,
      # 확인 후 반드시 제거한 뒤 재배포한다. 기본 상태(이 파일)는 production CA를 사용한다.
      # - "--certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
