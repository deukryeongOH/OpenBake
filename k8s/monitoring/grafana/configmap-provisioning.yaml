apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
data:
  prometheus.yml: |
    apiVersion: 1

    prune: true

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: 15s
      # 분산 추적 저장소. 로그에서 찾은 traceId를 여기 넣으면 그 요청이 서비스를
      # 가로지른 구간별 소요 시간이 보인다. 지표는 "느리다"까지 답하고,
      # 추적은 "어디서 느린가"까지 답한다.
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        editable: false
        jsonData:
          # trace 화면에서 그 서비스의 지표로 바로 넘어갈 수 있게 한다.
          tracesToMetrics:
            datasourceUid: prometheus
          # 서비스 간 호출 관계를 그림으로 보여준다.
          nodeGraph:
            enabled: true
          # trace 화면에서 "Logs for this span" 버튼으로 그 요청의 로그를 연다.
          # **지표 -> 추적 -> 로그 흐름의 마지막 연결이 이것이다.**
          tracesToLogsV2:
            datasourceUid: loki
            # trace 시각 앞뒤로 이만큼 넓혀 찾는다. 정확히 같은 순간의 로그만
            # 보면 앞뒤 맥락이 빠져 원인을 놓친다.
            spanStartTimeShift: '-2m'
            spanEndTimeShift: '2m'
            # 라벨로 좁힌 뒤 본문에서 traceId를 찾는다.
            # traceId를 라벨로 만들지 않은 이유는 promtail 설정 주석 참고
            # (값이 무한해서 스트림이 폭발한다).
            filterByTraceID: true
            tags:
              - key: 'service.name'
                value: 'svc'
      # 중앙 로그. Tempo의 trace 화면에서 traceId를 눌러 그 요청의 로그로
      # 바로 넘어갈 수 있다(아래 Tempo의 tracesToLogsV2 설정과 짝이다).
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        editable: false
        jsonData:
          # 로그에서 traceId를 찾아 Tempo로 넘어가는 반대 방향 연결.
          derivedFields:
            - name: TraceID
              # ECS JSON 로그의 traceId 필드에서 값을 뽑는다.
              matcherRegex: '"traceId":"([a-f0-9]+)"'
              url: '$${__value.raw}'
              datasourceUid: tempo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
data:
  openbake.yml: |
    apiVersion: 1

    providers:
      - name: OpenBake
        orgId: 1
        folder: OpenBake
        type: file
        disableDeletion: false
        editable: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
