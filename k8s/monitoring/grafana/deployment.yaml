apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  replicas: 1
  # 10번 문서 5장: 단일 PVC를 여러 Pod가 동시에 쓸 수 없어 Recreate.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - service
      containers:
        - name: grafana
          # latest는 imagePullPolicy가 Always로 잡혀 재시작마다 새 버전을 받는다.
          # 예고 없이 메이저 버전이 바뀌면 기동 시 DB 마이그레이션이 돌고 그동안
          # /api/health가 응답하지 못해 probe에 걸린다. 2026-08-26 실측 버전으로 고정한다.
          image: grafana/grafana:13.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          resources:
            requests:
              cpu: 100m
              # request는 일부러 올리지 않는다. 2026-08-26 기준 Node B는 메모리
              # request가 87%이고 HPA가 backend replica 2개째(640Mi)를 이 노드에
              # 띄운다. request를 올리면 그 자리를 먹어 HPA 확장을 막을 수 있다.
              # 실사용 하한(249Mi)보다 낮지만, 스케줄 압박을 만들지 않는 쪽을 택했다.
              memory: 128Mi
            limits:
              cpu: 300m
              # 2026-08-26: reason=OOMKilled로 재시작이 반복됐다. 실측 최고가
              # 498Mi로 limit 512Mi에 계속 부딪혔다(패널 47개를 조회할 때 몰린다).
              # limit은 스케줄링에 쓰이지 않으므로 올려도 배치에 영향이 없다.
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            # 2026-08-26: 대시보드를 열면 패널 쿼리가 몰려 /api/health가 2초를 넘기고,
            # 정상 동작 중인 Grafana가 liveness에 걸려 죽었다(exitCode 137).
            # 로그상 내부 처리가 4초 이상 막힌 구간이 있어 5초로 늘린다.
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning-dashboards
        - name: dashboards
          configMap:
            name: grafana-dashboards
