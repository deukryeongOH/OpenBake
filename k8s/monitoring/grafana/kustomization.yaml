apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# configMapGenerator로 만든 리소스에는 namespace가 없어 default로 들어간다.
# 그러면 Deployment가 grafana-dashboards를 못 찾아 ContainerCreating에서 멈춘다
# (2026-08-24 실측). 파일에 namespace가 박힌 리소스는 이 값과 같아 영향이 없다.
namespace: monitoring

resources:
  - configmap-provisioning.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml

# 대시보드 JSON(785줄, monitoring/grafana/dashboards에서 복사)은 literal data:로 손으로
# 옮기지 않고 generator로 만든다. Kustomize는 kustomization root 밖의 파일을 참조하지 못해
# monitoring/grafana/dashboards/openbake-performance-overview.json을 그대로 재사용할 수 없었고,
# 대신 이 디렉터리로 복사해 두었다 — 두 파일이 원본과 별도로 관리된다는 뜻이다. 보고 대상.
# 2026-08-26: 한 대시보드에 47개를 몰아넣으니 여는 순간 Grafana가 포화돼
# /api/health가 liveness 타임아웃을 넘겼다. 성격별로 나눠 한 번에 여는 패널을
# 최대 14개로 줄인다. provisioning은 디렉터리 전체를 읽으므로 파일만 추가하면 된다.
configMapGenerator:
  - name: grafana-dashboards
    files:
      # 발표용. 패널 9개만 둔다 — 프로젝터에서는 축 레이블이 먼저 읽히지 않는다.
      # 자동 새로고침을 꺼 두었다. 말하는 중에 숫자가 바뀌면 흐름이 끊긴다.
      - dashboards/openbake-presentation.json
      # k6 지표는 부하 시험을 돌릴 때만 들어온다. 상시 대시보드에 두면 "No data"가
      # 계속 떠서 모니터링이 안 붙어 있는 것처럼 보인다. 지우지 않고 옮긴 이유는
      # 시험을 돌리면 볼 곳이 필요해서다.
      - dashboards/openbake-load-test.json
      - dashboards/openbake-performance-overview.json
      - dashboards/openbake-infrastructure.json
      - dashboards/openbake-business-backlog.json
      - dashboards/openbake-backing-services.json
      # 저장소 내부와 결제 Saga. Backing Services와 나눈 이유: 그쪽은 회로 차단기·
      # Redis·Kafka로 이미 14패널이라, 여기 더 넣으면 "무엇을 보러 왔는가"가 흐려진다.
      - dashboards/openbake-datastores.json

generatorOptions:
  disableNameSuffixHash: true
