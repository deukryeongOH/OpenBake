apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  # ⚠️ 다른 관측 구성요소와 달리 openbake 네임스페이스다.
  #
  # Kafka의 KAFKA_ADVERTISED_LISTENERS가 "PLAINTEXT://kafka:29092"로 짧은 이름이다.
  # Kafka 클라이언트는 bootstrap 접속 후 브로커가 알려준 이 주소로 다시 연결하는데,
  # monitoring 네임스페이스의 Pod는 DNS search가 monitoring.svc.cluster.local이라
  # "kafka"를 해석하지 못한다. advertised listener를 FQDN으로 바꾸려면 브로커를
  # 재시작해야 하므로(토픽·KRaft 메타데이터 위험), exporter를 같은 네임스페이스에 둔다.
  namespace: openbake
  labels:
    app.kubernetes.io/name: kafka-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      # JMX exporter를 javaagent로 붙이면 Kafka StatefulSet을 수정해야 하고 재시작이
      # 따른다. 이 방식은 일반 Kafka 클라이언트로 접속해 조회만 하므로 브로커를
      # 건드리지 않는다.
      #
      # Node A는 CPU 요청 합계가 allocatable과 같아 여유가 0이라 Node B에 둔다.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: kafka-exporter
          # GitHub 저장소는 kafka_exporter(밑줄)지만 Docker Hub 이미지는 하이픈이다.
          # 밑줄로 쓰면 ImagePullBackOff가 난다.
          image: danielqsj/kafka-exporter:v1.7.0
          args:
            - --kafka.server=kafka.openbake.svc.cluster.local:29092
            # 브로커가 아직 안 떴을 때 종료되지 않고 재시도하게 한다.
            - --kafka.version=3.9.0
          ports:
            - containerPort: 9308
              name: metrics
          resources:
            requests:
              cpu: 15m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9308
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9308
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
