apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Loki와 log-agent는 이번 범위에서 제외한다. 03번 문서에 자원 예약값만 있고 설정 설계가 없다.
resources:
  - prometheus
  - alertmanager
  - grafana
  - node-exporter
  - kube-state-metrics
  - redis-exporter
  - blackbox-exporter
  - elasticsearch-exporter
  # kafka-exporter와 postgres-exporter는 openbake 네임스페이스다.
  # 전자는 advertised listener, 후자는 자격증명 Secret이 거기 있기 때문이다.
  # 이유는 각 매니페스트 주석 참고.
  - kafka-exporter
  - postgres-exporter
