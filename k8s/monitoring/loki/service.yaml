apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    # Grafana가 로그를 조회하고, Promtail이 로그를 밀어넣는 포트.
    - name: http
      port: 3100
      targetPort: 3100
      protocol: TCP
