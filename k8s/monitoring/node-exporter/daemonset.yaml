apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      # 09번 문서 5장의 디스크 여유 기준(70/80/90%)은 두 Node 모두에서 평가해야 하므로
      # Prometheus와 달리 node-pool을 고정하지 않고 DaemonSet으로 전 Node에 배치한다.
      tolerations:
        - operator: Exists
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.8.2
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            # rootfs를 지정하면 node-exporter가 mountpoint label에서 이 prefix를 제거한다.
            # 그래서 root EBS는 mountpoint="/"로 노출되고 09번 문서 기준을 그대로 쓸 수 있다.
            - --path.rootfs=/host/root
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/kubelet/.+|var/lib/docker/.+)($|/)
          ports:
            - containerPort: 9100
              name: metrics
          resources:
            requests:
              # 2026-08-26 실측 후 20m에서 0으로 내렸다. Node A는 CPU 요청 합계가
              # allocatable과 정확히 같아 여유가 0이라, 20m을 요청하면 이 DaemonSet Pod가
              # Node A에 스케줄되지 못하고 Pending이 된다. 하필 Node A가 디스크 사용률이
              # 높아 가장 봐야 할 노드다.
              # 실사용은 노드당 1~5m이라 예약을 0으로 둬도 손해가 없다. 대신 CPU 경합 시
              # 후순위가 되므로, Node A의 요청 여유가 생기면 20m으로 되돌린다.
              cpu: "0"
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 9100
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9100
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: root
          hostPath:
            path: /
