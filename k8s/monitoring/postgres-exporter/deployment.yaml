# PostgreSQL exporter 4대.
#
# 왜 openbake 네임스페이스인가: 각 DB의 자격증명 Secret(core/member/payment/ai
# -db-credentials)이 openbake에 있고, **Secret은 네임스페이스를 넘지 못한다**.
# monitoring에 두려면 Secret을 복제해야 하는데, 자격증명 사본을 늘리는 것은
# 08번 문서의 시크릿 취급 원칙에 어긋난다. kafka-exporter가 같은 네임스페이스에
# 있는 것도 같은 맥락이다.
#
# 왜 인스턴스마다 하나씩인가: postgres_exporter의 멀티 타깃 모드는 auth_module
# 설정 파일을 따로 요구하고, 대상마다 자격증명이 다른 지금 구성에서는 오히려
# 복잡해진다. 4개는 각각 10m/32Mi라 합쳐도 40m/128Mi다.
#
# 무엇을 얻나: HikariCP로 "앱이 커넥션을 기다린다"까지는 보였지만 **DB가 왜 느린지**는
# 볼 수 없었다. 락 대기, 서버 측 커넥션 수, 트랜잭션 나이, 데드락, 테이블 팽창이
# 이 exporter로 드러난다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-postgres-exporter
  namespace: openbake
  labels:
    app.kubernetes.io/name: core-postgres-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core-postgres-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-postgres-exporter
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
        # 4개 exporter를 한 번에 고르기 위한 공통 라벨. NetworkPolicy와 스크레이프
        # 설정이 이 라벨 하나로 4대를 모두 잡는다.
        openbake.io/exporter: postgres
    spec:
      # Node A는 CPU 예약 여유가 200m뿐이다(2026-08-26 실측 90%). 2026-08-25에
      # node-exporter 20m 때문에 backend가 Pending된 적이 있어 Node B로 보낸다.
      # 15초마다 가벼운 조회를 하는 수준이라 노드를 넘는 비용은 무시할 만하다.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          env:
            # URI와 자격증명을 나눠 넣는다. DATA_SOURCE_NAME 한 줄로 주면 비밀번호에
            # 들어간 특수문자를 URL 인코딩해야 하고, 인코딩을 빠뜨리면 조용히
            # 인증 실패로 떨어진다.
            - name: DATA_SOURCE_URI
              value: "core-postgres.openbake.svc.cluster.local:5432/openbake?sslmode=disable"
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: core-db-credentials
                  key: DB_USERNAME
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: core-db-credentials
                  key: DB_PASSWORD
            # 지표에 인스턴스를 구분할 라벨을 붙인다. 4대가 같은 지표 이름을 쓰므로
            # 이것이 없으면 대시보드에서 어느 DB인지 알 수 없다.
            - name: PG_EXPORTER_CONSTANT_LABELS
              value: "datastore=core"
          ports:
            - containerPort: 9187
              name: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          livenessProbe:
            httpGet:
              path: /
              port: 9187
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 9187
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
