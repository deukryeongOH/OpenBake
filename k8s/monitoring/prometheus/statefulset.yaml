apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      serviceAccountName: prometheus
      # 03번 문서 7장: Node A가 죽어도 관측이 살아 있어야 하므로 Node B 고정은 필수.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - service
      containers:
        - name: prometheus
          # latest는 재시작마다 새 버전을 받는다. Prometheus는 메이저 버전에서
          # 설정 문법과 동작이 바뀌므로 수집이 통째로 멈출 수 있다.
          # 2026-08-26 실측 버전으로 고정한다.
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # 보관 기간. 03번 문서 9장은 PVC 3Gi를 넘지 않도록 3일·1GB를 잡았으나,
            # 그 값으로는 **7일·28일 오류 예산을 계산할 수 없다**. SLO는 기간을 두고
            # 판정하는 것이라 3일치만으로는 원리적으로 불가능하다.
            #
            # 2026-08-26 실측으로 여유가 확인됐다.
            #   TSDB 현재     61.6MB (약 36시간치)  -> 하루 약 40MB
            #   28일 추정     약 1.2GB
            #   PVC           3Gi
            #   Node B 디스크  23.2GB 여유
            #
            # 히스토그램(게이트웨이 routeId, Traefik)과 exporter 2종(ES·PostgreSQL)이
            # 늘면서 하루 증가량이 커질 수 있으므로, size 상한을 안전장치로 함께 올린다.
            # time과 size 중 **먼저 걸리는 쪽이 적용**되므로 size가 디스크를 지킨다.
            - --storage.tsdb.retention.time=30d
            - --storage.tsdb.retention.size=2GB
            # 16번 문서 k6 remote write가 사용하는 경로.
            - --web.enable-remote-write-receiver
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          startupProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 3Gi
