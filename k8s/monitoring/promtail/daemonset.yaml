# Promtail — 각 노드의 컨테이너 로그를 읽어 Loki로 보낸다.
#
# DaemonSet인 이유: 로그 파일은 **그 Pod가 떠 있는 노드의 디스크**에 있다.
# 중앙에서 긁어올 수 없으므로 노드마다 하나씩 두고 자기 노드 것만 읽는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: openbake
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: openbake
rules:
  # Pod discovery에 필요한 최소 권한만 준다. 로그 파일 자체는 hostPath로 읽으므로
  # pods/log API 권한은 필요 없다.
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/part-of: openbake
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      serviceAccountName: promtail
      # ⚠️ CPU 요청을 0으로 둔다.
      #
      # 2026-08-25에 node-exporter가 CPU 20m을 요청하면서 Node A의 예약이 100%가
      # 되어 backend가 Pending에 빠진 적이 있다. DaemonSet은 모든 노드에 뜨므로
      # 빠듯한 노드에서 그 사고를 다시 낼 수 있다.
      #
      # 로그 읽어 보내는 일이라 실사용은 수 밀리코어 수준이다.
      containers:
        - name: promtail
          image: grafana/promtail:3.3.2
          args:
            - -config.file=/etc/promtail/promtail.yaml
          ports:
            - containerPort: 9080
              name: http
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "0"
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            # 어디까지 읽었는지 기록. 재시작 후 중복 수집을 막는다.
            - name: positions
              mountPath: /run/promtail
            # 실제 로그 파일. 읽기 전용으로 붙인다.
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/rancher/k3s/agent/containerd
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      tolerations:
        # 노드에 taint가 걸려도 로그 수집은 계속되어야 한다. 장애 조사 때
        # 하필 그 노드 로그가 없으면 곤란하다.
        - operator: Exists
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: positions
          hostPath:
            path: /run/promtail
            type: DirectoryOrCreate
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/rancher/k3s/agent/containerd
