apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: openbake
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/component: ai
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-credentials
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - core
      containers:
        - name: ai-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_bakerysite6_be-ai-service:sha-placeholder
          ports:
            - containerPort: 8083
              name: http
          env:
            # 03번 문서에 ai-service JVM 옵션이 없음. limit(768Mi)의 약 50%를 -Xmx로 쓰는
            # 다른 서비스 비율을 근거로 제안한 값 — 실측 전 미확정, 보고 대상.
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx384m"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ai-db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-db-credentials
                  key: DB_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-provider-credentials
                  key: OPENAI_API_KEY
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-auth-credentials
                  key: AI_SERVICE_TOKEN
            - name: CORE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-auth-credentials
                  key: CORE_SERVICE_TOKEN
          envFrom:
            - configMapRef:
                name: ai-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 768Mi
          # startup failureThreshold도 설계 문서에 없어 제안한 값 — 미확정, 보고 대상.
          # backend(DB+ES+Kafka 의존, 120s)와 member/payment(DB만 의존, 90s) 사이,
          # ai-service는 DB+ES+Kafka+Redis+backend 호출에 의존하므로 100s로 제안.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
