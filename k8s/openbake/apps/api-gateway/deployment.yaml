apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: openbake
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-credentials
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - core
      containers:
        - name: api-gateway
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_bakerysite6_be-api-gateway:sha-placeholder
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms128m -Xmx320m"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-credentials
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: gateway-config
          resources:
            requests:
              # 2026-08-26 실측으로 올림. 게이트웨이는 모든 요청이 지나는 단일 관문이고
              # 요청마다 JWT 검증과 Redis 블랙리스트 확인을 한다. request 100m 이면
              # 경합 시 backend(500m)와 1:5 로 밀린다.
              #
              # 300 동시 버스트에서 게이트웨이의 cpu.pressure 가 full 57% 였다 —
              # 쿼터(limit 500m)의 1/3만 쓰면서 전체 시간의 절반 이상 모든 스레드가
              # CPU 를 못 받고 멈춰 있었다. throttled_usec 은 0이라 cgroup 의 스로틀
              # 지표만 보면 정상으로 보이는 구간이다(PSI 로만 보인다).
              #
              # 자리는 ai-service(250m->100m)와 elasticsearch(300m->150m)에서 만들었다.
              cpu: 300m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 640Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            # 실측 기동 45.5초. 기존 12회(60초)는 여유가 15초뿐이라
            # 부하·재배포 시 startup probe 실패로 재시작 루프에 빠질 수 있다.
            # 2026-08-26 상향. 기존 18 x 5s = 90초였는데 한가한 상태의 JVM 기동이
            # 82초다(backend 실측). 여유가 8초뿐이라 노드가 조금만 붐벼도 실패한다.
            # 실제로 배포 한 번에 4개 서비스가 동시에 기동하다 startup probe 를 넘기지
            # 못하고 7~8회씩 재시작했다. backend 와 같은 240초로 맞춘다.
            failureThreshold: 48
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
