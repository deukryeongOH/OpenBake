apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: openbake
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: core
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  # HPA(이슈 4)가 replica를 관리한다. 필드를 생략하면 생성 시 기본 1로 시작하고 이후 apply가
  # 건드리지 않는다. replicas: 1을 남겨두면 HPA가 2로 올린 뒤 apply가 다시 1로 되돌려 충돌한다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # required podAntiAffinity와 함께 쓰려면 surge를 허용할 수 없다. replica 1에서
      # maxSurge:1이면 옛 Pod가 node-a를, 새 Pod가 node-b를 잡았다가 다시 옮겨오는
      # 왕복이 생기고, 두 Pod가 겹치는 동안 CPU를 다퉈 기동이 3분 넘게 걸렸다
      # (2026-08-24 실측). 옛 Pod를 먼저 내리고 새 Pod를 띄운다.
      #
      # replica 2 이상에서는 한 번에 하나씩 교체되므로 무중단이 유지된다.
      # replica 1에서는 기동 시간만큼(약 90초) 끊긴다.
      maxUnavailable: 1
      maxSurge: 0
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: core
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: registry-credentials
      affinity:
        nodeAffinity:
          # replica 1일 때는 데이터 계층이 있는 core(node-a)를 선호한다.
          # required가 아니라 preferred인 이유는 아래 podAntiAffinity 때문이다 —
          # replica 2는 반드시 다른 노드로 가야 하므로 core를 강제할 수 없다.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - core
        podAntiAffinity:
          # 03/05번 문서: backend replica 2개가 같은 Node에 오지 못하도록 강제(required).
          # 같은 노드에 두면 같은 코어를 나눠 쓰게 되어 스케일아웃의 의미가 없다.
          #
          # 2026-08-24에 이 규칙을 preferred로 낮춘 적이 있으나 오진이었다. 당시 node-b의
          # backend가 UnknownHostException: elasticsearch 로 죽은 것은 노드 문제가 아니라
          # Elasticsearch가 ImagePullBackOff로 죽어 있어(headless Service라 endpoint가
          # 사라지면 DNS가 NXDOMAIN) 발생한 것이었다. ES 복구 후 backend는 node-b에서
          # 정상 동작했다. 원 설계로 되돌린다.
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: backend
      containers:
        - name: backend
          image: ghcr.io/prgrms-be-adv-devcourse/beadv7_7_bakerysite6_be-backend:sha-placeholder
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: core-db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: core-db-credentials
                  key: DB_PASSWORD
            - name: TOSS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: toss-credentials
                  key: TOSS_SECRET_KEY
            - name: SETTLEMENT_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: settlement-credentials
                  key: SETTLEMENT_ENCRYPTION_KEY
            - name: AWS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY
            - name: AWS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_KEY
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-auth-credentials
                  key: AI_SERVICE_TOKEN
            - name: CORE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-auth-credentials
                  key: CORE_SERVICE_TOKEN
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests:
              # 2026-08-25 실측: 300 동시 부하에서 Pod CPU 피크 0.78(=780m).
              # request 300m 은 실사용 대비 낮아 HPA(목표 65%)가 195m 에서
              # 확장을 시작했다. limit 1000m 의 20%도 안 쓴 시점이라 과민했고,
              # 배포 시 JVM 기동 스파이크만으로도 replica 가 늘었다.
              # 500m 이면 65% = 325m 으로 실제 부하 구간에 가까워진다.
              cpu: 500m
              memory: 640Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            # 실측 87초(2026-08-23, 여유로운 상태)였으나 rollout 중에는 옛 Pod와
            # JVM 기동이 겹쳐 CPU를 다투느라 120초를 넘겨 kill 됐다(2026-08-24).
            # 기동이 느린 것 자체는 정상이므로 유예를 240초로 늘린다.
            # 이 값은 기동 중에만 쓰이고 정상 운영 중 응답성은 livenessProbe가 본다.
            failureThreshold: 48
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
