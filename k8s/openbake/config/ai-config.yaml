apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-config
  namespace: openbake
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/component: ai
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
data:
  AI_DB_URL: "jdbc:postgresql://ai-postgres:5432/openbake_ai"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  ELASTICSEARCH_URIS: "http://elasticsearch:9200"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
  CORE_SERVICE_URL: "http://backend:8080"
  SPRING_PROFILES_ACTIVE: "prod"
