apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: openbake
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/component: payment
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
data:
  # backend-config.yaml과 같은 이유. payment는 현재 프론트가 직접 부르지 않지만,
  # 세 서비스가 같은 SecurityConfig 패턴을 쓰므로 값을 맞춰 둔다.
  OPENBAKE_SECURITY_CORS_ALLOWED_ORIGINS: "https://bakery-site6-fe.vercel.app,http://localhost:3000,http://localhost:5173"
  PAYMENT_DB_URL: "jdbc:postgresql://payment-postgres:5432/openbake_payment"
  SPRING_PROFILES_ACTIVE: "prod"
