apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: openbake
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/component: search
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        app.kubernetes.io/component: search
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      # elasticsearch 프로세스가 uid 1000으로 실행되므로 local-path PVC 쓰기 권한 확보
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - core
      # 커스텀 이미지(ghcr.io/.../openbake-elasticsearch)는 analysis-nori 플러그인
      # 하나를 위해 존재했다. private GHCR 접근 권한이 필요해 배포가 계정 권한에
      # 묶이므로, 공개 이미지 + initContainer 설치로 바꿔 의존을 없앤다.
      # 플러그인은 emptyDir에 설치되어 Pod마다 새로 받는다(약 1MB).
      initContainers:
        - name: install-nori
          image: elasticsearch:9.0.3
          command:
            - sh
            - -c
            - elasticsearch-plugin install --batch analysis-nori
          volumeMounts:
            - name: plugins
              mountPath: /usr/share/elasticsearch/plugins
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: elasticsearch
          image: elasticsearch:9.0.3
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
              name: http
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: plugins
              mountPath: /usr/share/elasticsearch/plugins
          startupProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: 9200
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=1s
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: plugins
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 8Gi
