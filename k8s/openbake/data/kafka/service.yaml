apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: openbake
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: eventing
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  clusterIP: None
  # KRaft controller가 기동 중에 KAFKA_CONTROLLER_QUORUM_VOTERS(1@kafka:29093)로
  # 자기 자신을 찾아야 quorum이 만들어진다. headless Service는 기본적으로 Ready인
  # Pod만 DNS에 등록하므로, 이 값이 없으면 "기동하려면 이름이 필요한데 이름은
  # 기동이 끝나야 생기는" 교착에 빠져 UnknownHostException으로 CrashLoop한다.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 29092
      targetPort: 29092
    - name: controller
      port: 29093
      targetPort: 29093
