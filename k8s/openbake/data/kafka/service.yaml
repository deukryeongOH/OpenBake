apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: openbake
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: eventing
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: broker
      port: 29092
      targetPort: 29092
    - name: controller
      port: 29093
      targetPort: 29093
