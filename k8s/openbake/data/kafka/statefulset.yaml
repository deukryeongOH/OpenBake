apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: openbake
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: eventing
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: eventing
        app.kubernetes.io/part-of: openbake
        app.kubernetes.io/instance: production
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: openbake.io/node-pool
                    operator: In
                    values:
                      - core
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          env:
            # 이 값이 없으면 log.dirs가 설정되지 않아 Kafka 내장 기본값
            # /tmp/kafka-logs 로 떨어진다. PVC를 /var/lib/kafka/data 에 붙여놓고도
            # topic과 KRaft 메타데이터가 컨테이너 임시 영역에 쌓여 Pod 재시작마다
            # 사라진다 (2026-08-24 실측: meta.properties가 /tmp/kafka-logs 에 있었고
            # 브로커 조회에서도 log.dirs=null 이었다).
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:29092,CONTROLLER://:29093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:29092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:29093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
            # 09번 문서: 최대 3일·약 3Gi 상한. log.retention.bytes는 partition당 상한이라
            # topic·partition 수 전체 합계를 강제하지 못함 — 근사값이며 미확정으로 보고.
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "72"
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1073741824"
          ports:
            - containerPort: 29092
              name: broker
            - containerPort: 29093
              name: controller
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: 750m
              memory: 1280Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          # Kafka Probe는 04번 문서 6장(미래 구성요소)에 방식만 정의되어 있고
          # period/threshold 값은 없음 — 아래 값은 이번에 제안한 것이며 미확정으로 보고.
          # kafka-broker-api-versions.sh는 JVM을 새로 띄우므로 응답까지 5초를 넘긴다.
          # timeoutSeconds를 15초로 두고 period도 그에 맞춘다(총 유예는 동일하게 약 3분).
          startupProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 29092
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:29092"]
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path-retain
        resources:
          requests:
            storage: 5Gi
