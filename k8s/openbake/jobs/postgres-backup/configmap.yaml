apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-config
  namespace: openbake
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
data:
  # 설계 문서에 실제 bucket 이름과 region이 없어 placeholder로 둔다. 적용 전 실제 값으로 교체 필요 — 보고 대상.
  BACKUP_S3_BUCKET: "REPLACE_WITH_BACKUP_BUCKET_NAME"
  AWS_REGION: "REPLACE_WITH_AWS_REGION"
