apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-ai
  namespace: openbake
  labels:
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: openbake
    app.kubernetes.io/instance: production
spec:
  schedule: "10 3 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: openbake
            app.kubernetes.io/instance: production
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: postgres:17
              env:
                - name: DB_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: ai-db-credentials
                      key: DB_USERNAME
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: ai-db-credentials
                      key: DB_PASSWORD
                - name: BACKUP_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: backup-encryption-credentials
                      key: BACKUP_PASSPHRASE
              command:
                - sh
                - -c
                - |
                  set -eu
                  # 백업 버킷이 앱 이미지 서빙과 같은 공개 가능성이 있는 버킷이라
                  # dump를 평문으로 올리지 않는다. 복호화 절차는 jobs/README.md 참고.
                  command -v openssl >/dev/null 2>&1 || {
                    echo "openssl이 없다. 이 image로는 암호화할 수 없다 — README의 SSE-C 대안을 쓴다." >&2
                    exit 1
                  }
                  date +%Y/%m/%d > /backup/date.txt
                  pg_dump -Fc -h ai-postgres -U "$DB_USERNAME" -d openbake_ai -f /backup/openbake_ai.dump
                  pg_restore --list /backup/openbake_ai.dump > /dev/null
                  openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
                    -pass env:BACKUP_PASSPHRASE \
                    -in /backup/openbake_ai.dump -out /backup/openbake_ai.dump.enc
                  rm -f /backup/openbake_ai.dump
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.62
              envFrom:
                - configMapRef:
                    name: postgres-backup-config
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_ACCESS_KEY
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-credentials
                      key: AWS_SECRET_KEY
              command:
                - sh
                - -c
                - |
                  set -eu
                  DATE=$(cat /backup/date.txt)
                  KEY="postgres/ai/$DATE/openbake_ai.dump.enc"
                  aws s3 cp /backup/openbake_ai.dump.enc "s3://$BACKUP_S3_BUCKET/$KEY" --region "$AWS_REGION"
                  SIZE=$(aws s3api head-object --bucket "$BACKUP_S3_BUCKET" --key "$KEY" --region "$AWS_REGION" --query ContentLength --output text)
                  if [ "$SIZE" -le 0 ]; then
                    echo "backup object is empty: $KEY" >&2
                    exit 1
                  fi
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              emptyDir: {}
