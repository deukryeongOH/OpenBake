# grafana → tempo 3200 (trace 조회), prometheus → tempo 3200 (Tempo 자체 지표).
#
# 둘 다 monitoring 안이라 namespaceSelector 없이 podSelector만으로 충분하다.
#
# ── Prometheus가 Tempo를 긁는 이유 ──────────────────────────────────────
# 추적이 안 보일 때 원인이 둘이다. 애플리케이션이 안 보냈거나, Tempo가 못 받았거나.
# Tempo 자신의 지표(tempo_distributor_spans_received_total 등)가 있어야 그 둘을
# 구별할 수 있다. 없으면 "추적이 안 된다"에서 더 좁히지 못한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-and-prometheus-to-tempo
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tempo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 3200
