# k6(openbake) → prometheus(monitoring) 9090 remote write.
#
# ⚠️ 안전 확인: monitoring 네임스페이스에는 default-deny-ingress가 있고 prometheus
# Pod는 allow-grafana-to-prometheus에 선택되어 **이미 격리 상태**다. 따라서 이 파일은
# "차단을 시작"하지 않고 허용만 더한다. 같은 Pod를 선택하는 여러 NetworkPolicy는
# 합집합으로 동작한다.
#
# 이 확인이 필요한 이유는 2026-08-25 사고다. 정책이 하나도 없던 kube-system에
# Traefik 대상 정책을 넣었다가 Traefik이 격리 대상이 되어 외부 80/443이 전부
# 차단됐다. 정책이 없는 대상에 첫 정책을 넣는 것은 "허용 추가"가 아니라
# "차단 시작"이다. 경위는 docs/observability/rollout-log.md 참고.
#
# ── 왜 필요한가 ──────────────────────────────────────────────────────────
# k6는 부하 테스트 중 remote write로 Prometheus에 지표를 보낸다. 그 값이 있어야
# **사용자가 실제로 겪은 end-to-end 지연**을 볼 수 있다. 서버 측 지표(Spring)는
# 서블릿에 도착한 뒤부터만 재므로 큐 대기와 연결 수립 시간이 빠져 있다.
#
# 2026-08-27에 부하 테스트를 돌렸는데 k6_* 지표가 하나도 남지 않았다. 원인이 둘이었다.
#   1. K6_PROMETHEUS_RW_SERVER_URL이 localhost:9090 (Pod 안에서는 자기 자신이다)
#   2. 이 NetworkPolicy가 없어 통신 자체가 막혔다
# 하나만 고치면 여전히 조용히 실패한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-k6-to-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbake
          podSelector:
            matchLabels:
              # 부하 테스트 Pod에 이 라벨을 붙여야 한다.
              # 이름(k6-s4 등)은 실행마다 바뀌므로 라벨로 잡는다.
              openbake.io/role: load-test
      ports:
        - protocol: TCP
          port: 9090
