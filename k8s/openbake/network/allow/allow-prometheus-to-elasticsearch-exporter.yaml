# prometheus → elasticsearch-exporter 9114. 둘 다 monitoring 네임스페이스다.
#
# monitoring에는 default-deny-ingress가 있어 새 Pod도 자동으로 격리된다.
# 이 허용이 없으면 스크레이프가 조용히 실패한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-elasticsearch-exporter
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9114
