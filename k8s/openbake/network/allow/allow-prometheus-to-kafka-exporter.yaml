apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-kafka-exporter
  # kafka-exporter는 advertised listener 제약 때문에 openbake 네임스페이스에 있다.
  namespace: openbake
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9308
