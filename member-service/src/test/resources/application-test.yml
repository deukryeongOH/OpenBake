spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

oauth:
  providers:
    google:
      client-id: dummy-google-client-id

jwt:
  secret: test-secret-key-for-ci-do-not-use-in-production-32bytes+
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

CORE_SERVICE_TOKEN: test-core-service-token
