global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "openbake-core"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "192.168.115.116:8080"

  - job_name: "openbake-member"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "192.168.115.116:8081"

  - job_name: "openbake-payment"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "192.168.115.116:8082"