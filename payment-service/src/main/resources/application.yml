spring:
  application:
    name: openbake-payment

  lifecycle:
    timeout-per-shutdown-phase: 25s

  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET SESSION lock_timeout = '10s'
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8082
  shutdown: graceful

payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY:test_sk_xxxxxxxxxxxxxxx}
    connect-timeout: 3000
    read-timeout: 15000

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      slo:
        "[http.server.requests]":
          - 100ms
          - 300ms
          - 500ms
          - 1s
          - 2s

logging:
  # 요청 하나가 서비스를 가로지른 경로를 로그로 따라가려면 X-Request-Id가 로그에
  # 있어야 한다. 게이트웨이의 RequestIdFilter는 헤더 전달만 하고, 각 서비스가
  # common의 RequestIdMdcFilter로 MDC에 넣어야 %X{requestId}가 채워진다.
  # 값이 없는 로그(기동·배치)는 대괄호 안이 비어 보인다.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    org.hibernate.orm.jdbc.bind: trace
