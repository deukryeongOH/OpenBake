spring:
  application:
    name: openbake-payment

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET SESSION lock_timeout = '10s'

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

server:
  port: 8082

payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY:test_sk_xxxxxxxxxxxxxxx}
    connect-timeout: 3000
    read-timeout: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace
