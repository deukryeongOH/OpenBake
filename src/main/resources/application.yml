server:
  shutdown: graceful

spring:
  application:
    name: openbake

  lifecycle:
    timeout-per-shutdown-phase: 25s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET SESSION lock_timeout = '10s'
      maximum-pool-size: 10

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # 재고 선점은 fail-closed 정책이라, 응답이 없으면 거부해야 성립한다.
      # 타임아웃이 없으면 거부 대신 톰캣 스레드가 묶인다.
      timeout: ${REDIS_TIMEOUT:500ms}
    web:
      pageable:
        max-page-size: 20

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

# Batch 설정
# job.enabled: false : 서버가 시작될 때 정산이 자동 실행되는 것을 막고,
# 나중에 스케줄러나 API가 명시적으로 실행하도록 설정
# Spring Batch는 실행 이력을 저장하기 위한 메타데이터 테이블 사용을 위함
# (최초 1회만 사용 또는 script로 생성되는지 확인 예정)

  sql:
    init:
      mode: never
      schema-locations: classpath:org/springframework/batch/core/schema-postgresql.sql

  batch:
    job:
      enabled: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "existing schema before flyway"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

# ── ddl-auto 정책 (팀 결정 대기 중) ─────────────────────────
# 강의는 create + H2 인메모리 (재시작마다 초기화되는 강의용 세팅).
# 우리는 PostgreSQL을 5명이 공유하므로 그대로 쓸 수 없음.
#
#   update   : 현재 값. 초기 개발이 빠름.
#              단점 - 컬럼 삭제/이름변경이 반영 안 됨. 옛 컬럼이 계속 남아
#                    팀원 간 로컬 스키마가 조용히 어긋남.
#                    부하 테스트 시 인덱스 존재 여부를 확신할 수 없음.
#   none     : 스키마를 수동/마이그레이션 도구로 관리.
#   validate : 엔티티와 실제 스키마 일치 여부만 검증.
#
# → 스키마가 확정되면 재논의 필요.
# ───────────────────────────────────────────────────────

# ── 토스페이먼츠 설정 ──────────────────────────────────────
# 테스트 시크릿키는 토스 개발자센터에서 발급.
# 운영 시크릿키는 환경변수로 주입.
payment:
  toss:
    secret-key: ${TOSS_SECRET_KEY:test_sk_xxxxxxxxxxxxxxx}
    connect-timeout: 3000
    read-timeout: 15000

payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:8082}

# 매월 1일 오후 3시 "0 0 15 1 * *"
settlement:
  batch:
    monthly:
      cron: "-"
      zone: Asia/Seoul

openbake:

  security:
    ai-service-token: ${AI_SERVICE_TOKEN}

  # ES 재색인 배치 — RDB↔ES 드리프트 보정 안전망
  # 매일 새벽 3시 실행. 트래픽이 적은 시간대.
  reindex:
    cron: "0 0 3 * * *"

  member-service:
    url: ${MEMBER_SERVICE_URL:http://localhost:8081}

  search:
    semantic:
      enabled: ${SEMANTIC_SEARCH_ENABLED:true}
      timeout: PT0.5S
      pool-multiplier: 2
      candidate-max: 200
    rrf:
      k: 60

logging:
  level:
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
          - circuitbreakers
          - circuitbreakerevents
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

      slo:
        "[http.server.requests]":
          - 100ms
          - 300ms
          - 500ms
          - 1s
          - 2s

oauth:
  providers:
    google:
      issuer: https://accounts.google.com
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      client-id: ${GOOGLE_CLIENT_ID}

seller:
  settlement:
    # Base64로 인코딩된 AES-256(32바이트) 키. `openssl rand -base64 32`로 생성.
    encryption-key: ${SETTLEMENT_ENCRYPTION_KEY}

feign:
  client:
    config:
      member-service:
        connect-timeout: 1000
        read-timeout: 2000

resilience4j:
  circuitbreaker:
    instances:
      elasticsearch:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      ai-semantic-search:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

cloud:
  aws:
    active: true
    s3:
      bucket: ${S3_BUCKET_NAME:team06-s3-bakerysite6}
      region: ${S3_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
