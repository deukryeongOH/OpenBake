spring:
  elasticsearch:
    uris: http://localhost:9200

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # H2는 SET SESSION lock_timeout 문법을 모르므로 비활성화
      connection-init-sql:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  # 테스트 스키마는 Hibernate create-drop 이 만든다. Flyway 마이그레이션은 운영
  # PostgreSQL 의 '기존 스키마를 목표 스키마로 옮기는' 절차라 H2 에서 돌릴 이유가 없다.
  # (V3 는 컬럼 이름 변경·제약 삭제 등 PostgreSQL 전용 DDL 을 쓴다.)
  # ⚠️ 그래서 UNIQUE·인덱스 같은 운영 제약은 이 테스트로 검증되지 않는다.
  #    엔티티에 선언한 제약(orders.active_member_id UNIQUE 등)만 create-drop 으로 재현된다.
  #    운영 마이그레이션 자체의 검증은 PostgreSQL 통합 테스트로 따로 해야 한다(14장).
  flyway:
    enabled: false

payment:
  toss:
    secret-key: test_sk_dummy_for_testing
    connect-timeout: 3000
    read-timeout: 15000
jwt:
  secret: test-secret-key-for-ci-do-not-use-in-production-32bytes+
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000

seller:
  settlement:
    encryption-key: vda+GapT+dotms8HmcaQVkp9gbhfDH2YIteyLm2DTWw=

openbake:
  security:
    ai-service-token: ${AI_SERVICE_TOKEN:${random.uuid}}
  search:
    semantic:
      enabled: true
      timeout: PT0.5S
      pool-multiplier: 2
      candidate-max: 200
    rrf:
      k: 60

AI_SERVICE_URL: http://localhost:18083
CORE_SERVICE_TOKEN: ${random.uuid}

# S3 Config가 spring 빈에 등록되기 위해 추가(SellerSettlementEncryptionIntegrationTest 테스트 통과하기 위해 추가)
cloud:
  aws:
    credentials:
      access-key: dummy-access-key
      secret-key: dummy-secret-key
